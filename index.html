<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO: Search engines read these to understand your page -->
  <title>Huerta | Portfolio</title>
  <meta name="description" content="A brief description of your awesome project or portfolio.">

  <!-- CSS: Link to your stylesheet (make sure you have a style.css file) -->
  <link rel="stylesheet" href="huertarob.css">

  <!-- 3D Model Viewer-->

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

</head>


<body>


  <!-- Main Content Area -->
  <main>

    <!-- Hero Section: The first thing visitors see -->
    <section id="hero" class="hero">
      <h1>Hello, I'm <span class="highlight">Your Name</span></h1>
      <p>I build elegant and dynamic web applications.</p>
      <a href="#projects" class="btn-primary">View My Work</a>
    </section>

    <!-- Additional sections like About, Projects goes here -->

    <section class="model-container">
        <h2>3D Artifact Study</h2>
        <model-viewer
            src="path/to/your-model.glb"
            poster="path/to/poster-image.png"
            alt="A 3D model of a creative artifact"
            shadow-intensity="1"
            camera-controls
            auto-rotate
            ar>
        </model-viewer>
    </section>

  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Your Name. Built with HTML & CSS.</p>
  </footer>

  <!-- JavaScript: Link to your logic scripts at the bottom for faster page load -->
  <script src="script.js"></script>
</body>
</html>
